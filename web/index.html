<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VerificAI | Inteligência Documental</title>
  <link rel="icon" type="image/png" href="/icon.jpg" />
  <script type="module" src="/src/main.ts"></script>
</head>
<body class="flex h-screen overflow-hidden bg-gray-50">

  <aside class="w-80 bg-white border-r border-gray-200 flex flex-col hidden md:flex shadow-sm z-10">
    <div class="h-20 flex items-center px-6 border-b border-gray-100">
  <img src="/icon.jpg" alt="Logo" class="w-10 h-10 rounded-xl mr-3 object-cover shadow-sm border border-gray-100">
  <div class="flex flex-col">
    <span class="font-bold text-gray-900 tracking-tight leading-none text-lg">VerificAI</span>
    <span class="text-[10px] text-green-600 font-bold uppercase tracking-widest mt-1">Inteligência Documental</span>
  </div>
</div>
    <div class="p-4 bg-gray-50 border-b border-gray-100 space-y-4">
      <div>
        <div class="flex justify-between items-center mb-2">
          <label for="threshold-range" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">
            Sensibilidade (Threshold)
          </label>
          <span id="threshold-value" class="text-[10px] font-mono bg-black text-white px-1.5 py-0.5 rounded">0.50</span>
        </div>
        <input type="range" id="threshold-range" min="0" max="1" step="0.05" value="0.50" 
          class="w-full h-1 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-black">
      </div>

      <div class="flex justify-between items-center p-2.5 bg-white border border-gray-200 rounded-xl shadow-sm">
        <div class="flex items-center gap-2">
          <div class="p-1 bg-green-50 text-green-600 rounded-md">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </div>
          <span class="text-[9px] font-bold text-gray-400 uppercase">Custo Sessão</span>
        </div>
        <span class="text-[10px] font-mono font-bold text-gray-700">USD <span id="cost-display">0.000000</span></span>
      </div>
    </div>

    <div class="p-4 pb-0">
        <label for="file-upload" class="flex items-center justify-center w-full gap-2 p-3 bg-black text-white rounded-xl cursor-pointer hover:bg-gray-800 transition-all shadow-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            <span class="text-xs font-semibold">Adicionar PDF</span>
        </label>
        <input id="file-upload" type="file" class="hidden" accept=".pdf" multiple />
    </div>

    <div class="flex-1 overflow-y-auto p-4">
      <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4 px-2">Biblioteca Indexada</h3>
      <div id="sources-list" class="space-y-2"></div>
    </div>

    <div class="p-4 border-t border-gray-100">
        <button id="clear-btn" class="flex items-center justify-center w-full gap-2 p-2.5 text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-colors group">
            <svg class="w-4 h-4 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            <span class="text-xs font-semibold">Limpar Memória</span>
        </button>
    </div>
  </aside>

  <main class="flex-1 flex flex-col relative">
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 sm:p-8 scroll-smooth no-scrollbar">
      <div id="chat-box" class="max-w-3xl mx-auto space-y-6 pb-32">
        <div class="flex flex-col items-center justify-center py-10 opacity-60">
          <div class="w-12 h-12 bg-gray-200 rounded-full flex items-center justify-center mb-4">
            <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
          </div>
          <p class="text-sm font-medium text-gray-500">Como posso ajudar com seus documentos hoje?</p>
        </div>
      </div>
    </div>

    <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-gray-50 via-gray-50 to-transparent pt-10 pb-6 px-4">
      <div class="max-w-3xl mx-auto">
        <div class="relative group">
          <div class="absolute -inset-0.5 bg-gradient-to-r from-gray-200 to-gray-300 rounded-2xl opacity-50 blur group-hover:opacity-75 transition duration-200"></div>
          <div class="relative bg-white rounded-2xl shadow-lg flex items-center p-2 border border-gray-100">
            <input id="user-input" type="text" placeholder="Faça uma pergunta sobre o conteúdo..." class="flex-1 bg-transparent border-none focus:ring-0 px-4 py-3 text-gray-700 placeholder-gray-400 text-sm font-medium outline-none" autocomplete="off" />
            <button id="send-btn" class="bg-black text-white p-3 rounded-xl hover:bg-gray-800 transition-all duration-200 hover:scale-105 active:scale-95 shadow-md">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
          </div>
        </div>
<p class="text-[10px] text-center text-gray-400 mt-3">O VerificAI pode cometer erros. Verifique as fontes originais.</p>      </div>
    </div>
  </main>

  <div id="context-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
      <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden">
          <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
              <div>
                  <h3 id="context-filename" class="text-sm font-bold text-gray-900 italic">Documento</h3>
                  <p id="context-page" class="text-[10px] text-gray-500 uppercase font-semibold mt-1">Página --</p>
              </div>
              <button id="close-context" class="p-2 hover:bg-gray-200 rounded-full transition-colors text-gray-400">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
              </button>
          </div>
          <div class="p-8 max-h-[60vh] overflow-y-auto">
              <div id="context-text" class="text-sm text-gray-700 leading-relaxed border-l-4 border-black pl-4"></div>
          </div>
      </div>
  </div>

 <div id="modal-overlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-2xl border border-gray-100">
        <div class="flex items-center gap-3 text-red-500 mb-4">
            <div class="bg-red-50 p-2 rounded-full">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h3 class="text-lg font-bold text-gray-900">Confirmar Ação</h3>
        </div>
        
        <p id="modal-text" class="text-sm text-gray-600 mb-6">Você tem certeza que deseja realizar esta operação?</p>
        
        <div class="flex gap-3">
            <button id="modal-cancel" class="flex-1 px-4 py-2 bg-gray-100 text-gray-700 rounded-xl font-medium hover:bg-gray-200 transition-colors">Cancelar</button>
            <button id="modal-confirm" class="flex-1 px-4 py-2 bg-red-500 text-white rounded-xl font-medium hover:bg-red-600 transition-colors shadow-sm">Confirmar</button>
        </div>
    </div>
  </div>

</body>
</html>
